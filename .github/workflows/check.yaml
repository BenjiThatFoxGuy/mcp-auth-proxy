name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && github.ref || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Check gofmt
        run: |
          files=$(gofmt -s -l .)
          echo "$files"
          test -z "$files"
      - run: go vet ./...
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
